name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      scope:
        description: 'affected: changes since the merge base with dev; e2e: only the listed specs; package: build, package and packaged smoke only; full: complete checks and packaging'
        type: choice
        options: [full, affected, e2e, package]
        default: full
      specs:
        description: 'e2e scope: space-separated spec files, e.g. workbench.spec.ts project.spec.ts'
        type: string
        default: ''
      grep:
        description: 'e2e scope: optional Playwright --grep pattern'
        type: string
        default: ''

permissions:
  contents: read

# Manual runs get their own group so a reviewer's run never cancels another check of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  scope:
    name: Documentation and change scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app: ${{ steps.scope.outputs.app }}
      base: ${{ steps.scope.outputs.base }}
      e2e: ${{ steps.scope.outputs.e2e }}
      mode: ${{ steps.scope.outputs.mode }}
      specs: ${{ steps.scope.outputs.specs }}
    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Determine required checks
        id: scope
        run: node scripts/check-scope.mjs

      - name: Install documentation and script-test dependencies only
        run: pnpm --filter ai-developer-studio install --frozen-lockfile --ignore-scripts

      - name: Check documentation regressions
        env:
          CHECK_BASE: ${{ steps.scope.outputs.base }}
        # Manual full and spec runs have no diff baseline; historical docs audit is separate.
        run: pnpm check:docs --base "${CHECK_BASE:-HEAD}" --head HEAD

  desktop:
    name: macOS arm64 checks
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runner architecture
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('Expected macOS arm64')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and unit tests
        if: needs.scope.outputs.mode == 'full'
        run: pnpm check:code

      # The desktop main process loads the Adapter from dist; spec-only runs skip check:code, which builds it.
      - name: Build desktop once for E2E and packaging
        if: needs.scope.outputs.mode != 'affected'
        run: |
          pnpm --filter @ai-studio/agent-adapter run build
          pnpm --filter @ai-studio/desktop run build

      - name: Configure desktop display for layout tests
        if: needs.scope.outputs.e2e == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install displayplacer
          displayplacer list
          ci_display_id="$(displayplacer list | awk '/Persistent screen id:/ && !found { print $4; found = 1 }')"
          test -n "$ci_display_id"
          displayplacer "id:$ci_display_id res:1920x1080 scaling:off origin:(0,0) degree:0"
          displayplacer list

      - name: Check affected modules and selected Electron specs
        if: needs.scope.outputs.mode == 'affected'
        env:
          CHECK_BASE: ${{ needs.scope.outputs.base }}
        run: node scripts/check-affected.mjs --base "$CHECK_BASE" --head HEAD --ci

      - name: Requested Electron specs
        if: needs.scope.outputs.mode == 'e2e'
        env:
          E2E_SPECS: ${{ needs.scope.outputs.specs }}
          E2E_GREP: ${{ inputs.grep }}
        run: |
          read -ra args <<< "$E2E_SPECS"
          if [ -n "$E2E_GREP" ]; then args+=(--grep "$E2E_GREP"); fi
          pnpm --filter @ai-studio/desktop run test:e2e:built "${args[@]}"

      - name: Electron E2E and native smoke
        if: needs.scope.outputs.mode == 'full'
        run: pnpm --filter @ai-studio/desktop run test:e2e:built

      - name: Package unsigned macOS app
        if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.mode == 'package'
        run: pnpm --filter @ai-studio/desktop run package:built

      - name: Install pinned CLIs for packaged discovery smoke
        if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.mode == 'package'
        run: |
          npm install --prefix "$RUNNER_TEMP/studio-cli" --no-audit --no-fund \
            @openai/codex@0.161.0 @anthropic-ai/claude-code@2.1.294
          ci_cli_bin="$RUNNER_TEMP/studio-cli/node_modules/.bin"
          ci_node_bin="$(dirname "$(command -v node)")"
          # LaunchServices starts with a minimal PATH. Configure the runner's
          # login shells so the app must resolve these CLIs as it does in Finder.
          # Keep $PATH literal for expansion when the login shell reads it.
          # shellcheck disable=SC2016
          printf '\nexport PATH="%s:%s:$PATH"\n' "$ci_cli_bin" "$ci_node_bin" \
            | tee -a "$HOME/.bash_profile" "$HOME/.zprofile"
          "$ci_cli_bin/codex" --version
          "$ci_cli_bin/claude" --version

      - name: Packaged app smoke
        if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.mode == 'package'
        run: pnpm smoke:packaged

      - name: Upload test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-test-evidence-${{ github.run_attempt }}
          path: |
            .runtime/desktop-e2e/
            .runtime/desktop/packaged-smoke.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
