# V1 unsigned macOS arm64 app directory (DEC-15, DEC-21, DEC-22).
# Signing / notarization and publication remain release-time decisions.
appId: dev.aistudio.desktop
productName: AI Developer Studio
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
  # node-pty sources and other platforms' binaries are not needed at runtime.
  - "!**/node_modules/node-pty/{deps,src,third_party,scripts,typings,binding.gyp}"
  - "!**/node_modules/node-pty/prebuilds/win32-*/**"
extraResources:
  - from: out/native
    to: files
    filter:
      - rename-exclusive
      - project-ripgrep
  - from: build
    to: icons
    filter:
      - icon.png
      - icon-dark.png
asar: true
# Native binaries (pty.node, spawn-helper) must live outside the asar archive.
asarUnpack:
  - "**/node_modules/node-pty/**"
  # ripgrep (Search, Quick Open) is a native executable and cannot run from inside the archive.
  - "**/node_modules/@vscode/ripgrep-*/**"
# node-pty ships N-API prebuilds that load in Electron as-is; no Electron rebuild.
npmRebuild: false
afterPack: scripts/after-pack.cjs
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  minimumSystemVersion: 13.0.0
  icon: build/icon.png
  target:
    - target: dir
      arch: [arm64]
  identity: null
  category: public.app-category.developer-tools
