name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  desktop:
    name: macOS arm64 checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runner architecture
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('Expected macOS arm64')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and unit tests
        run: pnpm check:commit

      - name: Configure desktop display for layout tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install displayplacer
          displayplacer list
          ci_display_id="$(displayplacer list | awk '/Persistent screen id:/ && !found { print $4; found = 1 }')"
          test -n "$ci_display_id"
          displayplacer "id:$ci_display_id res:1920x1080 scaling:off origin:(0,0) degree:0"
          displayplacer list

      - name: Electron E2E and native smoke
        run: pnpm test:e2e

      - name: Package unsigned macOS app
        run: pnpm package

      - name: Packaged app smoke
        run: pnpm smoke:packaged

      - name: Upload test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-test-evidence-${{ github.run_attempt }}
          path: |
            .runtime/desktop-e2e/
            .runtime/desktop/packaged-smoke.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
