<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选品工作台</title><link rel="stylesheet" href="selection.css"></head>
<body>
<main>
<div class="canvas-top"><nav id="stages" class="float-bar stage-bar" aria-label="选品流程"></nav><div class="top-actions"><div class="float-bar" role="group" aria-label="工作台操作"><button id="task-toggle" class="icon-button" aria-label="任务要求" data-tip="任务要求" aria-expanded="false" aria-controls="task-settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15H6V5a1 1 0 0 1 1-1zM9 9h6M9 13h6"/></svg></button><button id="auto-layout" class="icon-button" aria-label="自动排布" data-tip="自动排布"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6v5H4zM14 5h6v5h-6zM9 15h6v5H9zM7 10v2.5h10V10M12 12.5V15"/></svg></button><button id="compare" class="icon-button" aria-label="比较入选" data-tip="比较入选"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="7" height="16" rx="1.5"/><rect x="13.5" y="4" width="7" height="16" rx="1.5"/></svg></button><button id="export" class="icon-button" aria-label="导出交接简报" data-tip="导出交接简报"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 20h14"/></svg></button></div><button id="add-node" class="primary add-node" data-tip="新建节点"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建节点</span></button></div></div>
<details id="task-settings"><summary>选品任务与资料</summary><div class="task-form"><label>任务目标<textarea id="brief" rows="2" placeholder="例如：为家居品牌寻找适合秋冬上新的桌面摆件，零售价 100–300 元。"></textarea></label><label>资料与来源<textarea id="sources" rows="2" placeholder="粘贴调研资料、网址或项目内文件相对路径。"></textarea></label><button id="save-task">保存要求</button></div><div class="task-actions"><span class="provider">Codex CLI · <span id="progress">4 个流程</span></span><button id="run-all" class="primary">运行四个流程</button><button id="stop-all" hidden>停止编排</button></div></details>
<div id="canvas" class="canvas" tabindex="0" role="region" aria-label="选品无限画布"></div>
<div class="notice-bar"><span id="notice" role="status" aria-live="polite">正在读取工作台…</span><button id="notice-close" class="icon-button" aria-label="关闭提示"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<aside id="detail" aria-label="节点详情" hidden></aside>
</main>
<dialog id="compare-dialog"><div class="dialog-head"><h2>候选方案比较</h2><button id="close-compare">关闭</button></div><div id="comparison"></div></dialog>
<dialog id="edit-dialog"><div id="edit-form"><div class="dialog-head"><h2 id="edit-heading">新增节点</h2><button type="button" id="cancel-edit">取消</button></div><label id="edit-label"><span id="edit-label-text">名称</span><input id="edit-value" maxlength="2000" required></label><label id="edit-stage-label">所属流程<select id="edit-stage"><option value="0">数据收集与整理</option><option value="1">数据汇总分析</option><option value="2">方案生成</option><option value="3">方案对应的设计</option></select></label><div class="detail-actions"><button id="confirm-edit" type="button" class="primary">保存</button></div></div></dialog>
<script type="module" src="selection.js"></script>
</body></html>
